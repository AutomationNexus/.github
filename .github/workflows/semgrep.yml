name: Semgrep

on:
  workflow_call:
    inputs:
      # Same input, same default, same JSON-array shape as ci.yml and nightly.yml.
      # The default is the org's ARC pool: every job runs self-hosted, in public and
      # private repos alike. A bare `ubuntu-latest` would resolve to GitHub's hosted
      # pool -- only the full JSON array matches the ARC label set.
      runner-labels:
        description: "JSON array of runner labels"
        required: false
        default: '["linux","x64","k3s","ubuntu-latest"]'
        type: string
permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # Installed, rather than run as a `container:` job, purely to keep the job
      # self-contained and fast -- semgrep is one pip package, so a job-level
      # container buys nothing here.
      #
      # An earlier version of this comment claimed the ARC pods have no Docker
      # daemon. That was wrong: ci.yml's ha-validate job runs `docker run` on ARC
      # today (verified on pod arc-sh-gh-runner-7phc8-runner-z5dtl), so Docker is
      # available. Do not reintroduce that assumption.
      #
      # A venv rather than a bare `pip install` because both Ubuntu 24.04 bases
      # mark the system Python externally-managed (PEP 668).
      - name: Install semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet --upgrade pip semgrep
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"
      - run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/secrets \
            --json --output=semgrep-report.json \
            --metrics=off || true
      - name: Summarize findings
        if: always()
        run: |
          if [ ! -s semgrep-report.json ]; then echo "No report."; exit 0; fi
          ERRORS=$(jq '[.results[]? | select(.extra.severity=="ERROR")] | length' semgrep-report.json 2>/dev/null || echo 0)
          WARNINGS=$(jq '[.results[]? | select(.extra.severity=="WARNING")] | length' semgrep-report.json 2>/dev/null || echo 0)
          echo "Semgrep — ERROR: $ERRORS  WARNING: $WARNINGS"
      # Same reasoning as ci.yml's security-reports upload: the scan itself already
      # `|| true`s, so this report is pure diagnostics and an upload blip must not be the
      # only thing that reddens the check.
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: semgrep-report-${{ github.run_id }}
          path: semgrep-report.json
          retention-days: 1
