on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: automationnexus/.github/.github/workflows/ci.yml@v1
    with:
      branch-model: main-only
      has-security: false
      lint-paths: 'scripts'
      has-yaml-lint: true
      has-shellcheck: true
      # Without both of these the shared `test` job skips itself, which is how tests/
      # (promote-reconcile, the main-file guard, the governance scenarios) sat unrun in
      # this repo's own CI while every consumer repo gated on the logic they cover.
      # No package to build -- the suite is git fixtures plus the scripts it imports.
      # pyyaml is what scripts/validate-governance.py needs (it exits at import without
      # it, taking test_governance_scenarios.py's collection with it); same dependency
      # the docs and test-standards jobs already pip-install. jsonschema is deliberately
      # left out: the validator treats it as optional and its hand-rolled checks are the
      # authoritative ones.
      pip-install-cmd: 'python -m pip install --quiet pytest pyyaml'
      test-cmd: 'python -m pytest tests -q'
