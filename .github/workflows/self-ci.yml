on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: automationnexus/.github/.github/workflows/ci.yml@v1
    with:
      branch-model: main-only
      has-security: false
      lint-paths: 'scripts'
      has-yaml-lint: true
      has-shellcheck: true
      # Without both of these the shared `test` job skips itself, which is how tests/
      # (promote-reconcile, the main-file guard, the governance scenarios) sat unrun in
      # this repo's own CI while every consumer repo gated on the logic they cover.
      # Only pytest is installed: the suite is stdlib + git fixtures, no package to build.
      pip-install-cmd: 'python -m pip install --quiet pytest'
      test-cmd: 'python -m pytest tests -q'
